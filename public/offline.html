<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#176b47">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Connect to HisabFlow</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#23261f;background:#f5f6f5;font-synthesis:none;color-scheme:light}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(19px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(19px,env(safe-area-inset-left))}
    main{width:min(100%,420px);padding:32px 26px;border:1px solid #e3e9dc;border-radius:24px;background:#fff;box-shadow:0 10px 26px -18px #10281935;text-align:center}
    img{display:block;margin:0 auto 24px;width:52px;height:52px}h1{font-size:27px;line-height:1.3;letter-spacing:-.8px;margin:0 0 14px;font-weight:650}p{font-size:15px;line-height:1.7;color:#53604b;margin:0 auto;max-width:32ch}.connection{display:inline-block;margin:24px 0 0;padding:6px 11px;background:#fbf2df;border-radius:20px;color:#795414;font-size:12px;font-weight:600}
    a{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;margin-top:24px;padding:12px 16px;border-radius:12px;background:#176b47;color:#fff;text-decoration:none;font-size:15px;font-weight:600}a:hover{background:#12563a}a:focus-visible{outline:3px solid #8cb853;outline-offset:4px}small{display:block;margin-top:18px;color:#63705d;font-size:12px;line-height:1.6}
    @media(prefers-color-scheme:dark){:root{color:#e7ecdf;background:#1f271e;color-scheme:dark}main{background:#293128;border-color:#49583e}p,small{color:#c3cfba}.connection{background:#493b22;color:#efd29b}a{background:#b3f444;color:#273518}a:hover{background:#c4fa68}}
    @media(max-height:450px){main{padding:23px 26px}img{margin-bottom:16px;width:44px;height:44px}.connection{margin-top:16px}a{margin-top:18px}}
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <img src="/favicon.svg" width="52" height="52" alt="HisabFlow">
    <h1 id="title">You’re offline.</h1>
    <p id="description">Reconnect to open your workspace and check your latest saved records.</p>
    <span class="connection" id="connection" role="status">Connection required</span>
    <a href="/" id="retry">Try again <span aria-hidden="true">↗</span></a>
    <small>Your business records stay private. This page contains no workspace data.</small>
  </main>
  <script>
    const connection=document.getElementById('connection');
    function reconnect(){connection.textContent=navigator.onLine?'Connection detected — try again':'Connection required';}
    window.addEventListener('online',reconnect);window.addEventListener('offline',reconnect);
  </script>
</body>
</html>
